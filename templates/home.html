<div class="home-grid">
  <aside class="side side-left" aria-hidden="true">
    <p class="side-verse">香火是记你的账</p>
    <img class="side-img" src="${root}assets/img/censer.webp" alt="">
  </aside>

  <div class="home-core">
    <section class="hero">
      <div class="seal">$seal</div>
      <h1 class="hero-title">$sitetitle</h1>
      <p class="hero-tag">$tagline</p>
      <p class="hero-sub">—— 门内纪事 · 永昌二年</p>
    </section>
    <section class="toc">
      <h2 class="toc-head">正篇<span class="site-status">$status</span></h2>
      <ul class="toc-list">$chapters</ul>
      <h2 class="toc-head toc-head-extra">番外</h2>
      <ul class="toc-list toc-list-extra">$extras</ul>
    </section>
  </div>

  <aside class="side side-right" aria-hidden="true">
    <p class="side-verse">天是死的</p>
    <img class="side-img" src="${root}assets/img/sun.webp" alt="">
    <img class="side-img" src="${root}assets/img/well.webp" alt="">
  </aside>
</div>
